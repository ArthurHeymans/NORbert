name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust and WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tool -> target
          key: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes libudev-dev pkg-config

      - name: Check formatting
        run: cargo fmt --manifest-path tool/Cargo.toml --all -- --check

      - name: Test native tool
        run: cargo test --manifest-path tool/Cargo.toml

      - name: Lint native tool
        run: cargo clippy --manifest-path tool/Cargo.toml --all-targets -- --deny warnings

      - name: Lint WebAssembly tool
        run: cargo clippy --manifest-path tool/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features wasm -- --deny warnings

      - name: Build Web UI
        run: trunk build --release

  verilog:
    name: Verilog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The GW5A mapping and RAM simulation models come from the pinned
      # forks in flake.lock, not the stock OSS CAD Suite.
      - uses: cachix/install-nix-action@v31

      - name: Run Yosys and Verilator checks
        run: nix develop .#oss --command make lint

      - name: Simulate SPI, SDRAM and TOCTOU
        run: nix develop .#oss --command make test

      - name: Simulate the Yosys GW5A netlist
        run: nix develop .#oss --command make test-gate

      - name: Open-source place, route and pack
        run: nix develop .#oss --command make build-oss
