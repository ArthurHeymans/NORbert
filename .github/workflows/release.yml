name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify tag matches Rust package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          package_version="$(python3 - <<'PY'
          import tomllib
          with open("tool/Cargo.toml", "rb") as manifest:
              print(tomllib.load(manifest)["package"]["version"])
          PY
          )"
          test "$TAG_NAME" = "$package_version" || {
            echo "Tag $TAG_NAME does not match Rust package version $package_version" >&2
            exit 1
          }

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Allow Gowin FHS sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Build FPGA bitstream
        run: nix develop --command make build

      - name: Package release bitstream
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # One bitstream per release. The name has to stay spi_flash.fs:
          # the web UI links to releases/latest/download/spi_flash.fs, and
          # releases/latest only resolves a literal asset name, not a
          # versioned one. The release title carries the version.
          cp impl/pnr/spi_flash.fs spi_flash.fs
          sha256sum spi_flash.fs > SHA256SUMS
          web_url=https://arthurheymans.github.io/NORbert/
          wiring_url=https://github.com/ArthurHeymans/NORbert#browser-jtag-wiring
          cat > release-notes.md <<EOF
          ## Programming the Tang Primer 25K

          Download \`spi_flash.fs\` and program it with
          [openFPGALoader](https://github.com/trabucayre/openFPGALoader):

          \`\`\`sh
          # Volatile: runs immediately, lost on power-off
          openFPGALoader -b tangprimer25k spi_flash.fs

          # Persistent: boots automatically after power-on
          openFPGALoader -b tangprimer25k -f spi_flash.fs
          \`\`\`

          Check the download against the attached \`SHA256SUMS\`:
          \`sha256sum --check SHA256SUMS\`.

          You can also open the [NORbert Web UI](${web_url}), choose
          **Bitstream**, select the downloaded \`.fs\` file, and program SRAM
          or flash through WebUSB. This path requires an external FT2232H
          connected to the Dock's external-JTAG header; see the
          [browser JTAG wiring guide](${wiring_url}). Chromium and an
          HTTPS/localhost page are required.

          The release tag and Rust package version are both \`${TAG_NAME}\`.
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "NORbert $TAG_NAME" \
            --notes-file release-notes.md \
            spi_flash.fs \
            SHA256SUMS
